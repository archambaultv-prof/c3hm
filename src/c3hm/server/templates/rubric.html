{% extends "base.html" %}

{% block title %}Corriger — c3hm{% endblock %}

{% block content %}
<div class="rubric-section">
    <!-- En-tête avec nom d'étudiant et progression -->
    <div class="rubric-header">
        <div>
            <h2 id="student-name">Chargement...</h2>
            <p id="progress-text" class="progress-text">Chargement...</p>
        </div>
    </div>

    <!-- Barre d'actions (Sauvegarder) en haut -->
    <div class="rubric-actions rubric-actions-top">
        <button id="prev-btn" class="btn btn-nav btn-nav-prev" disabled>
            ← Précédent
        </button>
        <div class="save-group">
            <button id="save-btn-top" class="btn btn-primary btn-large" onclick="saveRubric()">
                💾 Sauvegarder les modifications
            </button>
            <span id="save-status-top" class="save-status"></span>
        </div>
        <div class="action-right">
            <label class="sync-checkbox-label">
                <input type="checkbox" id="sync-to-teammates-top" class="sync-checkbox">
                Synchroniser avec les coéquipiers
            </label>
            <button id="next-btn" class="btn btn-nav btn-nav-next" disabled>
                Suivant →
            </button>
        </div>
    </div>

    <!-- Coéquipiers -->
    <div class="rubric-team">
        <div class="team-header">
            <div>
                <div class="team-title">Coéquipiers</div>
                <div class="team-subtitle">Ajouter ou retirer des coéquipiers</div>
            </div>
            <div class="team-add">
                <select id="teammate-add-select" class="team-add-select"></select>
                <button id="add-teammate-btn" class="btn btn-primary btn-small" onclick="addTeammate()">
                    Ajouter
                </button>
            </div>
        </div>
        <ul id="teammates-list" class="team-list"></ul>
    </div>

    <!-- Container principal avec grille -->
    <div class="rubric-container">
        <div class="rubric-grid-wrapper">
            <div id="rubric-content" class="rubric-content">
                <p class="loading">Chargement de la rubric...</p>
            </div>
        </div>
    </div>

    <!-- Commentaires de l'enseignant -->
    <div class="rubric-comment">
        <label for="comment-text" class="comment-label">Commentaires de l'enseignant</label>
        <textarea id="comment-text" class="comment-text" rows="5" placeholder="Ajouter un commentaire..."></textarea>
    </div>

    <!-- Barre d'actions (Sauvegarder) en bas -->
    <div class="rubric-actions rubric-actions-bottom">
        <button id="prev-btn-bottom" class="btn btn-nav btn-nav-prev" disabled>
            ← Précédent
        </button>
        <div class="save-group">
            <button id="save-btn" class="btn btn-primary btn-large" onclick="saveRubric()">
                💾 Sauvegarder les modifications
            </button>
            <span id="save-status" class="save-status"></span>
        </div>
        <div class="action-right">
            <label class="sync-checkbox-label">
                <input type="checkbox" id="sync-to-teammates" class="sync-checkbox">
                Synchroniser avec les coéquipiers
            </label>
            <button id="next-btn-bottom" class="btn btn-nav btn-nav-next" disabled>
                Suivant →
            </button>
        </div>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script>
    const filename = "{{ filename }}";
    let currentRubric = null;
    let modifications = {}; // Tracer les modifications: {crit_idx: {ind_idx: level_label}}
    let commentModified = false;
    let teammatesModified = false;
    let criterionOverrides = {};
    let criterionOverridesModified = false;
    let rubricGradeOverride = null;
    let rubricGradeOverrideModified = false;
    let invalidCriterionOverrides = new Set();
    let rubricOverrideInvalid = false;
    let allStudents = [];
    let teammates = [];
    let syncToTeammates = false; // Nouveau: flag pour synchroniser aux coéquipiers
    let saveStatusTimeout = null;

    // Charger la rubric au chargement de la page
    document.addEventListener("DOMContentLoaded", () => {
        loadRubric();
        loadNavigation();
        setSaveStatusNoChanges();
        
        // Setup pour la case à cocher de synchronisation
        const syncCheckboxes = document.querySelectorAll(".sync-checkbox");
        syncCheckboxes.forEach(checkbox => {
            checkbox.addEventListener("change", (e) => {
                syncToTeammates = e.target.checked;
                // Synchroniser l'état entre les deux checkboxes
                syncCheckboxes.forEach(cb => {
                    cb.checked = syncToTeammates;
                });
            });
        });
    });

    async function loadRubric() {
        try {
            const response = await fetch(`/api/rubric/${filename}`);
            if (!response.ok) {
                throw new Error("Erreur lors du chargement de la rubric");
            }

            currentRubric = await response.json();
            initializeGradeOverrides();
            renderRubric();
            await loadTeammates();
        } catch (error) {
            document.getElementById("rubric-content").innerHTML = `<p class="error">Erreur: ${error.message}</p>`;
        }
    }

    function initializeGradeOverrides() {
        criterionOverrides = {};
        rubricGradeOverride = currentRubric.grade_override ?? null;
        criterionOverridesModified = false;
        rubricGradeOverrideModified = false;
        invalidCriterionOverrides = new Set();
        rubricOverrideInvalid = false;
        if (!currentRubric || !currentRubric.criteria) {
            return;
        }
        currentRubric.criteria.forEach((criterion, idx) => {
            if (criterion.grade_override !== null && criterion.grade_override !== undefined && criterion.grade_override !== "") {
                criterionOverrides[idx] = criterion.grade_override;
            }
        });
    }

    function normalizeOverrideValue(value) {
        const trimmed = String(value ?? "").trim();
        if (trimmed === "") {
            return null;
        }
        const parsed = Number(trimmed);
        return Number.isFinite(parsed) ? parsed : null;
    }

    function validateOverrideValue(rawValue, min, max) {
        const trimmed = String(rawValue ?? "").trim();
        if (trimmed === "") {
            return { valid: true, value: null };
        }
        const parsed = Number(trimmed);
        if (!Number.isFinite(parsed)) {
            return { valid: false, value: null };
        }
        if (parsed < min || parsed > max) {
            return { valid: false, value: parsed };
        }
        return { valid: true, value: parsed };
    }

    function formatOverrideValue(value) {
        if (value === null || value === undefined || value === "") {
            return "—";
        }
        const parsed = Number(value);
        if (!Number.isFinite(parsed)) {
            return "—";
        }
        return Number.isInteger(parsed) ? parsed.toString() : parsed.toFixed(1);
    }

    function formatComputedValue(value) {
        if (value === null || value === undefined) {
            return "—";
        }
        return Math.round(value).toString();
    }

    function overrideDiffers(overrideValue, computedValue) {
        if (overrideValue === null || overrideValue === undefined || overrideValue === "") {
            return false;
        }
        if (computedValue === null || computedValue === undefined) {
            return false;
        }
        const overrideNumber = Number(overrideValue);
        const computedNumber = Number(computedValue);
        if (!Number.isFinite(overrideNumber) || !Number.isFinite(computedNumber)) {
            return false;
        }
        return Math.abs(overrideNumber - computedNumber) >= 0.01;
    }

    async function loadNavigation() {
        try {
            const response = await fetch(`/api/rubric/navigation/${filename}`);
            if (!response.ok) return;

            const nav = await response.json();
            document.getElementById("prev-btn").disabled = nav.previous === null;
            document.getElementById("next-btn").disabled = nav.next === null;
            document.getElementById("prev-btn-bottom").disabled = nav.previous === null;
            document.getElementById("next-btn-bottom").disabled = nav.next === null;

            const goPrevious = async () => {
                if (nav.previous) {
                    await saveAndNavigate(`/rubric/${nav.previous}`);
                }
            };

            const goNext = async () => {
                if (nav.next) {
                    await saveAndNavigate(`/rubric/${nav.next}`);
                }
            };

            document.getElementById("prev-btn").onclick = goPrevious;
            document.getElementById("next-btn").onclick = goNext;
            document.getElementById("prev-btn-bottom").onclick = goPrevious;
            document.getElementById("next-btn-bottom").onclick = goNext;

            // Mise à jour du texte de progression
            document.getElementById("progress-text").textContent = `Étudiant ${nav.current_index + 1} / ${nav.total}`;
        } catch (error) {
            console.error("Erreur de navigation:", error);
        }
    }

    function clearSaveStatusTimeout() {
        if (saveStatusTimeout) {
            clearTimeout(saveStatusTimeout);
            saveStatusTimeout = null;
        }
    }

    function setSaveStatus(message, className) {
        clearSaveStatusTimeout();
        const statusTop = document.getElementById("save-status-top");
        const statusBottom = document.getElementById("save-status");
        if (statusTop) {
            statusTop.textContent = message;
            statusTop.className = className;
        }
        if (statusBottom) {
            statusBottom.textContent = message;
            statusBottom.className = className;
        }
    }

    function setSaveStatusNoChanges() {
        setSaveStatus("✓ Aucune modification à sauvegarder", "save-status");
    }

    function scheduleNoChangesStatus() {
        clearSaveStatusTimeout();
        saveStatusTimeout = setTimeout(() => {
            setSaveStatusNoChanges();
        }, 3000);
    }

    function renderRubric() {
        if (!currentRubric) return;

        document.getElementById("student-name").textContent = currentRubric.student_name;
        const commentField = document.getElementById("comment-text");
        commentField.value = currentRubric.comment || "";
        commentField.oninput = () => {
            commentModified = true;
            setSaveStatus("⚠️ Modifications non sauvegardées", "save-status unsaved");
        };

        const levels = currentRubric.levels;
        const criteria = currentRubric.criteria;

        let html = '<table class="rubric-table">';
        html += '<thead><tr>';
        html += '<th class="indicator-col indicator-header" id="rubric-grade-header">';
        html += '<div class="indicator-header-wrap">';
        html += '<div class="indicator-header-title">Note totale</div>';
        html += '<div class="indicator-header-grade">';
        html += '<span id="rubric-grade-value" class="grade-value">—</span>';
        html += '<span class="grade-max">/ 100</span>';
        html += '</div>';
        html += '<div class="indicator-header-override">';
        html += '<label for="rubric-grade-override" class="grade-override-label">Ajuster</label>';
        html += '<input'
            + ' id="rubric-grade-override"'
            + ' class="grade-override-input"'
            + ' type="number"'
            + ' min="0"'
            + ' max="100"'
            + ' step="0.1"'
            + ' placeholder="—"'
            + ' oninput="setRubricGradeOverride(this.value)"'
            + '>';
        html += '</div>';
        html += '<div id="rubric-grade-error" class="grade-error-text"></div>';
        html += '</div>';
        html += '</th>';

        // En-têtes de niveaux
        for (let levelIdx = 0; levelIdx < levels.length; levelIdx++) {
            const level = levels[levelIdx];
            html += `<th class="level-header" style="background-color: ${level.color};">${level.label}<br><small>${Math.round(level.percentage * 100)}%</small></th>`;
        }
        html += '</tr></thead>';

        html += '<tbody>';

        // Afficher chaque critère et ses indicateurs
        for (let critIdx = 0; critIdx < criteria.length; critIdx++) {
            const criterion = criteria[critIdx];

            const criterionPoints = criterion.indicators.reduce((total, indicator) => total + indicator.points, 0);
            const criterionOverrideValue = criterionOverrides.hasOwnProperty(critIdx)
                ? criterionOverrides[critIdx]
                : (criterion.grade_override ?? "");

            // Ligne du critère
            html += `<tr class="criterion-row">`;
            html += `<td class="criterion-label" id="criterion-cell-${critIdx}">`;
            html += `<div class="criterion-label-main"><strong>${criterion.label}</strong></div>`;
            html += `
                <div class="criterion-grade-wrap">
                    <span class="criterion-grade-label">Note calculée</span>
                    <span class="criterion-grade-value" id="criterion-grade-${critIdx}">—</span>
                    <span class="criterion-grade-max">/ ${criterionPoints}</span>
                </div>
                <div class="criterion-override-row">
                    <label for="criterion-grade-override-${critIdx}" class="grade-override-label">Ajuster</label>
                    <input
                        class="criterion-grade-override"
                        id="criterion-grade-override-${critIdx}"
                        type="number"
                        min="0"
                        max="${criterionPoints}"
                        step="0.1"
                        placeholder="Ajuster"
                        value="${criterionOverrideValue ?? ""}"
                        oninput="setCriterionOverride(${critIdx}, this.value)"
                    >
                </div>
                <div class="criterion-grade-error" id="criterion-grade-error-${critIdx}"></div>
            `;
            for (let levelIdx = 0; levelIdx < levels.length; levelIdx++) {
                html += `<td class="level-cell"></td>`;
            }
            html += `</tr>`;

            // Lignes des indicateurs
            for (let indIdx = 0; indIdx < criterion.indicators.length; indIdx++) {
                const indicator = criterion.indicators[indIdx];
                html += `<tr class="indicator-row">`;
                html += `<td class="indicator-label">
                    <span class="indicator-name">${indicator.label}</span>
                    <span class="indicator-points">${indicator.points} pts</span>
                </td>`;

                // Cellules de niveau
                for (let levelIdx = 0; levelIdx < levels.length; levelIdx++) {
                    const isSelected = indicator.graded_level_idx === levelIdx;
                    const cellClass = isSelected ? "level-cell selected" : "level-cell";
                    const descriptor = indicator.descriptors[levelIdx] || "";
                    html += `<td class="${cellClass}" data-crit="${critIdx}" data-ind="${indIdx}" data-level="${levelIdx}" onclick="selectLevel(${critIdx}, ${indIdx}, ${levelIdx}, '${levels[levelIdx].label}')">`;
                    html += `<div class="cell-content">`;
                    if (isSelected) {
                        html += '<span class="check-mark">✓</span>';
                    }
                    html += `<div class="descriptor-text">${descriptor}</div>`;
                    html += `</div>`;
                    html += '</td>';
                }
                html += `</tr>`;
            }
        }

        html += '</tbody></table>';
        document.getElementById("rubric-content").innerHTML = html;
        const rubricOverrideInput = document.getElementById("rubric-grade-override");
        if (rubricOverrideInput) {
            rubricOverrideInput.value = rubricGradeOverride ?? "";
        }
        updateGradeDisplays();
    }

    function setCriterionOverride(critIdx, value) {
        const criterion = currentRubric?.criteria?.[critIdx];
        if (!criterion) {
            return;
        }
        const criterionPoints = criterion.indicators.reduce((total, indicator) => total + indicator.points, 0);
        const { valid, value: parsedValue } = validateOverrideValue(value, 0, criterionPoints);
        const input = document.getElementById(`criterion-grade-override-${critIdx}`);
        const error = document.getElementById(`criterion-grade-error-${critIdx}`);

        if (!valid) {
            invalidCriterionOverrides.add(critIdx);
            if (input) {
                input.classList.add("invalid");
            }
            if (error) {
                error.textContent = `Valeur entre 0 et ${criterionPoints}`;
            }
            setSaveStatus("✗ Valeur de note invalide", "save-status error");
            return;
        }

        invalidCriterionOverrides.delete(critIdx);
        if (input) {
            input.classList.remove("invalid");
        }
        if (error) {
            error.textContent = "";
        }

        criterionOverrides[critIdx] = parsedValue;
        criterion.grade_override = parsedValue;
        criterionOverridesModified = true;
        setSaveStatus("⚠️ Modifications non sauvegardées", "save-status unsaved");
        updateGradeDisplays();
    }

    function setRubricGradeOverride(value) {
        const { valid, value: parsedValue } = validateOverrideValue(value, 0, 100);
        const input = document.getElementById("rubric-grade-override");
        const error = document.getElementById("rubric-grade-error");

        if (!valid) {
            rubricOverrideInvalid = true;
            if (input) {
                input.classList.add("invalid");
            }
            if (error) {
                error.textContent = "Valeur entre 0 et 100";
            }
            setSaveStatus("✗ Valeur de note invalide", "save-status error");
            return;
        }

        rubricOverrideInvalid = false;
        if (input) {
            input.classList.remove("invalid");
        }
        if (error) {
            error.textContent = "";
        }

        rubricGradeOverride = parsedValue;
        if (currentRubric) {
            currentRubric.grade_override = rubricGradeOverride;
        }
        rubricGradeOverrideModified = true;
        setSaveStatus("⚠️ Modifications non sauvegardées", "save-status unsaved");
        updateGradeDisplays();
    }

    function getCriterionOverride(criterion, critIdx) {
        if (criterionOverrides.hasOwnProperty(critIdx)) {
            return criterionOverrides[critIdx];
        }
        return criterion.grade_override ?? null;
    }

    function computeCriterionGrade(criterion, critIdx) {
        const overrideValue = getCriterionOverride(criterion, critIdx);
        const overridden = overrideValue !== null && overrideValue !== undefined && overrideValue !== "";
        let total = 0;
        for (const indicator of criterion.indicators) {
            if (indicator.graded_level_idx === null || indicator.graded_level_idx === undefined) {
                return { computedValue: null, effectiveValue: null, overridden };
            }
            const level = currentRubric.levels[indicator.graded_level_idx];
            if (!level) {
                return { computedValue: null, effectiveValue: null, overridden };
            }
            total += indicator.points * level.percentage;
        }
        const effectiveValue = overridden ? overrideValue : total;
        return { computedValue: total, effectiveValue: effectiveValue, overridden };
    }

    function computeRubricGrade() {
        const overrideValue = rubricGradeOverride ?? currentRubric.grade_override ?? null;
        const rubricOverrideSet = overrideValue !== null && overrideValue !== undefined && overrideValue !== "";
        
        // Always compute the purely computed value (no overrides)
        let computedTotal = 0;
        for (let critIdx = 0; critIdx < currentRubric.criteria.length; critIdx++) {
            const criterion = currentRubric.criteria[critIdx];
            const { computedValue } = computeCriterionGrade(criterion, critIdx);
            if (computedValue === null || computedValue === undefined) {
                return { computedValue: null, effectiveValue: null, overridden: false };
            }
            computedTotal += Math.round(computedValue);
        }
        
        // If rubric override is set, it takes precedence over all criterion overrides
        if (rubricOverrideSet) {
            return { computedValue: computedTotal, effectiveValue: overrideValue, overridden: true };
        }
        
        // No rubric override - compute effective value from criteria with their own overrides
        let effectiveTotal = 0;
        for (let critIdx = 0; critIdx < currentRubric.criteria.length; critIdx++) {
            const criterion = currentRubric.criteria[critIdx];
            const { effectiveValue } = computeCriterionGrade(criterion, critIdx);
            if (effectiveValue === null || effectiveValue === undefined) {
                return { computedValue: computedTotal, effectiveValue: null, overridden: false };
            }
            effectiveTotal += Math.round(effectiveValue);
        }
        
        return { computedValue: computedTotal, effectiveValue: effectiveTotal, overridden: false };
    }

    function updateGradeDisplays() {
        if (!currentRubric) {
            return;
        }

        currentRubric.criteria.forEach((criterion, critIdx) => {
            const display = document.getElementById(`criterion-grade-${critIdx}`);
            if (!display) {
                return;
            }
            const { computedValue } = computeCriterionGrade(criterion, critIdx);
            const overrideValue = getCriterionOverride(criterion, critIdx);
            const overridden = overrideDiffers(overrideValue, computedValue);
            display.textContent = formatComputedValue(computedValue);
            display.classList.toggle("grade-overridden", overridden);
            const cell = document.getElementById(`criterion-cell-${critIdx}`);
            if (cell) {
                cell.classList.toggle("override-active", overridden);
            }
        });

        const rubricDisplay = document.getElementById("rubric-grade-value");
        if (rubricDisplay) {
            const { computedValue } = computeRubricGrade();
            const overrideValue = rubricGradeOverride ?? currentRubric.grade_override ?? null;
            const overridden = overrideDiffers(overrideValue, computedValue);
            rubricDisplay.textContent = formatComputedValue(computedValue);
            rubricDisplay.classList.toggle("grade-overridden", overridden);
            const headerCell = document.getElementById("rubric-grade-header");
            if (headerCell) {
                headerCell.classList.toggle("override-active", overridden);
            }
        }
    }

    async function loadTeammates() {
        const response = await fetch("/api/students");
        if (!response.ok) {
            return;
        }
        allStudents = await response.json();
        teammates = (currentRubric.teammates || []).map((tm) => ({
            first_name: tm.first_name,
            last_name: tm.last_name,
            omnivox_id: tm.omnivox_id
        }));
        renderTeammates();
    }

    function selectLevel(critIdx, indIdx, levelIdx, levelLabel) {
        if (!modifications[critIdx]) {
            modifications[critIdx] = {};
        }
        modifications[critIdx][indIdx] = levelLabel;

        // Mettre à jour dans currentRubric pour effectuer le rendu
        currentRubric.criteria[critIdx].indicators[indIdx].graded_level = levelLabel;
        currentRubric.criteria[critIdx].indicators[indIdx].graded_level_idx = levelIdx;

        // Re-rendre la grille
        renderRubric();

        // Afficher une indication visuelle que des modifications ont été faites
        setSaveStatus("⚠️ Modifications non sauvegardées", "save-status unsaved");
    }

    async function saveRubric(options = {}) {
        const { silentNoChanges = false } = options;
        if (rubricOverrideInvalid || invalidCriterionOverrides.size > 0) {
            setSaveStatus("✗ Corriger les notes ajustées invalides", "save-status error");
            return false;
        }
        const commentValue = document.getElementById("comment-text").value;
        const teammates = getSelectedTeammates();
        if (
            Object.keys(modifications).length === 0
            && !commentModified
            && !teammatesModified
            && !criterionOverridesModified
            && !rubricGradeOverrideModified
        ) {
            if (!silentNoChanges) {
                setSaveStatusNoChanges();
            }
            // Même si rien à sauvegarder, synchroniser si demandé
            if (syncToTeammates && teammates.length > 0) {
                return await syncToSelectedTeammates();
            }
            return true;
        }

        try {
            document.getElementById("save-btn").disabled = true;
            document.getElementById("save-btn-top").disabled = true;
            setSaveStatus("Sauvegarde en cours...", "save-status");

            const response = await fetch(`/api/rubric/${filename}/save`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    updates: modifications,
                    comment: commentValue,
                    teammates: teammates,
                    criteria_overrides: criterionOverridesModified ? criterionOverrides : undefined,
                    rubric_grade_override: rubricGradeOverrideModified ? rubricGradeOverride : undefined
                })
            });

            if (!response.ok) {
                const error = await response.json();
                throw new Error(error.error || "Erreur lors de la sauvegarde");
            }

            modifications = {}; // Réinitialiser les modifications
            commentModified = false;
            teammatesModified = false;
            criterionOverridesModified = false;
            rubricGradeOverrideModified = false;
            
            // Synchroniser aux coéquipiers si demandé
            if (syncToTeammates && teammates.length > 0) {
                return await syncToSelectedTeammates();
            }
            
            setSaveStatus("✓ Rubric sauvegardée avec succès", "save-status saved");
            scheduleNoChangesStatus();

            return true;
        } catch (error) {
            setSaveStatus(`✗ Erreur: ${error.message}`, "save-status error");
            return false;
        } finally {
            document.getElementById("save-btn").disabled = false;
            document.getElementById("save-btn-top").disabled = false;
        }
    }

    async function saveAndNavigate(targetUrl) {
        const ok = await saveRubric({ silentNoChanges: true });
        if (ok) {
            window.location.href = targetUrl;
        }
    }

    function getSelectedTeammates() {
        return teammates.map((tm) => ({
            first_name: tm.first_name,
            last_name: tm.last_name,
            omnivox_id: tm.omnivox_id
        }));
    }

    function renderTeammates() {
        const list = document.getElementById("teammates-list");
        const addSelect = document.getElementById("teammate-add-select");
        list.innerHTML = "";
        addSelect.innerHTML = "";

        const placeholder = document.createElement("option");
        placeholder.value = "";
        placeholder.textContent = "Choisir un étudiant...";
        placeholder.disabled = true;
        placeholder.selected = true;
        addSelect.appendChild(placeholder);

        if (teammates.length === 0) {
            const empty = document.createElement("li");
            empty.className = "team-empty";
            empty.textContent = "Aucun coéquipier";
            list.appendChild(empty);
        } else {
            for (const tm of teammates) {
                const item = document.createElement("li");
                item.className = "team-item";
                item.innerHTML = `
                    <span class="team-name">${tm.last_name}, ${tm.first_name} (${tm.omnivox_id})</span>
                    <button class="team-remove" onclick="removeTeammate('${tm.omnivox_id}')">Supprimer</button>
                `;
                list.appendChild(item);
            }
        }

        const currentId = currentRubric.student.omnivox_id;
        const teammateIds = new Set(teammates.map((tm) => tm.omnivox_id));
        const available = allStudents.filter(
            (student) => student.omnivox_id !== currentId && !teammateIds.has(student.omnivox_id)
        );

        for (const student of available) {
            const option = document.createElement("option");
            option.value = student.omnivox_id;
            option.textContent = `${student.last_name}, ${student.first_name} (${student.omnivox_id})`;
            option.dataset.firstName = student.first_name;
            option.dataset.lastName = student.last_name;
            option.dataset.omnivoxId = student.omnivox_id;
            addSelect.appendChild(option);
        }

        const addBtn = document.getElementById("add-teammate-btn");
        addBtn.disabled = available.length === 0;
        addSelect.onchange = () => {
            addBtn.disabled = addSelect.value === "";
        };
        if (available.length > 0) {
            addBtn.disabled = true;
        }

        // Disable/enable sync checkboxes based on whether there are teammates
        const syncCheckboxes = document.querySelectorAll(".sync-checkbox");
        syncCheckboxes.forEach(checkbox => {
            checkbox.disabled = teammates.length === 0;
            if (teammates.length === 0) {
                checkbox.checked = false;
                syncToTeammates = false;
            }
        });
    }

    function markTeammatesModified() {
        teammatesModified = true;
        setSaveStatus("⚠️ Modifications non sauvegardées", "save-status unsaved");
    }

    function addTeammate() {
        const select = document.getElementById("teammate-add-select");
        const opt = select.selectedOptions[0];
        if (!opt || opt.value === "") {
            return;
        }
        teammates.push({
            first_name: opt.dataset.firstName,
            last_name: opt.dataset.lastName,
            omnivox_id: opt.dataset.omnivoxId
        });
        renderTeammates();
        markTeammatesModified();
    }

    function removeTeammate(omnivoxId) {
        teammates = teammates.filter((tm) => tm.omnivox_id !== omnivoxId);
        renderTeammates();
        markTeammatesModified();
    }

    async function syncToSelectedTeammates() {
        const teammates = getSelectedTeammates();
        if (teammates.length === 0) {
            return true;
        }

        try {
            setSaveStatus("Synchronisation en cours...", "save-status");
            const response = await fetch(`/api/rubric/${filename}/copy-to-teammates`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    teammates: teammates
                })
            });

            if (!response.ok) {
                const error = await response.json();
                throw new Error(error.error || "Erreur lors de la synchronisation");
            }

            setSaveStatus("✓ Rubric sauvegardée et synchronisée avec les coéquipiers", "save-status saved");
            scheduleNoChangesStatus();
            return true;
        } catch (error) {
            setSaveStatus(`✗ Erreur: ${error.message}`, "save-status error");
            return false;
        }
    }
</script>
{% endblock %}
